async function evalOne(o){let p=live[o.sym];if(!p)return;let baseRisk=Math.abs(o.entry-(o.initialSl||o.sl))||1;o.maxPrice=Math.max(o.maxPrice||o.entry,p);o.minPrice=Math.min(o.minPrice||o.entry,p);let favorable=o.side==='LONG'?o.maxPrice-o.entry:o.entry-o.minPrice;o.mfe=Math.max(o.mfe||0,favorable);o.mfeR=o.mfe/baseRisk;let curR=(o.side==='LONG'?p-o.entry:o.entry-p)/baseRisk,age=(Date.now()-o.opened)/60000,dd=o.mfeR>0?o.mfeR-curR:0;try{let t=(await api('/api/v5/market/ticker?instId='+o.sym))[0],a=t?await ana(o.sym,t):null;if(a){let same=a.side===o.side,conf=Math.round(same?a.quality:Math.max(0,100-a.quality));o.currentConfidence=conf;o.structureSame=same}}catch(_){}let conf=o.currentConfidence??o.entryConfidence??50,drop=(o.entryConfidence||o.quality||50)-conf,status='HOLD',reason='趨勢仍支持原方向',baseLife=o.window?o.window.life:null,rawRemain=baseLife==null?null:baseLife-age,remain=rawRemain==null?null:Math.max(0,rawRemain);o.windowRemain=remain;o.windowOver=rawRemain!=null&&rawRemain<0?Math.abs(rawRemain):0;o.lifeExtended=0;o.recheckRound=0;o.nextRecheck=null;let hardStop=40;if(baseLife!=null&&age>=baseLife){let after=age-baseLife,round=Math.floor(after/5)+1;o.recheckRound=round;let maxExt=conf>=85&&o.structureSame!==false?10:conf>=75&&o.structureSame!==false?5:0;o.lifeExtended=maxExt;o.nextRecheck=maxExt?Math.max(0,baseLife+maxExt-age):0;if(age>=hardStop&&curR<.5){status='EXIT';reason='Hard Time Stop：持倉已達 '+Math.floor(age)+' 分鐘且未形成足夠延伸'}else if(maxExt===0){status='EXIT';reason=curR>0?'重新確認未通過，優先保留目前浮盈':'重新確認未通過，訊號不再授權續抱'}else if(after>maxExt){status='EXIT';reason='延長觀察已用完，需退出重新等待新訊號'}else{status='HOLD';reason='第 '+round+' 次重新確認通過：信心 '+conf+'、結構同向，延長至 '+(baseLife+maxExt)+'m'}}if(o.window){let decay=Math.max(.25,Math.min(1,conf/(o.entryConfidence||o.quality||1))),lifeFactor=remain==null?1:Math.max(.35,Math.min(1,remain/(o.window.life||1))),momentum=Math.max(.35,Math.min(1,decay*.7+lifeFactor*.3)),targetR=Math.max(curR+.12,Math.min(o.window.highR,o.window.lowR+(o.window.highR-o.window.lowR)*momentum));o.recommendedTp=o.side==='LONG'?o.entry+baseRisk*targetR:o.entry-baseRisk*targetR;o.recommendedTpR=targetR;o.recommendedTpU=targetR*(o.riskU||0);o.tpDistancePct=Math.abs(o.recommendedTp-p)/p*100;o.estRemainU=Math.max(0,(targetR-curR)*(o.riskU||0))}if(status!=='EXIT'&&o.window&&remain<=0&&curR>0&&o.lifeExtended===0){status='EXIT';reason='訊號有效時間已到，優先保留浮盈'}else if(status!=='EXIT'&&curR<=-1){status='EXIT';reason='已觸及原始風險區'}else if(o.mfeR>=.5&&curR<=0){status='EXIT';reason='浮盈已全部回吐'}else if(o.structureSame===false&&conf<45){status='EXIT';reason='結構已反向'}else if((drop>=18||conf<55)&&o.mfeR>=.35){status='PROTECT';reason='訊號信心下降，保護浮盈'}else if(age>=20&&curR<.2){status='WATCH';reason='接近訊號有效時間'}o.exitStatus=status;o.exitReason=reason;o.curR=curR;o.drawdownR=dd;o.ageMin=age}

function go(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('.nav').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('title').textContent=b.textContent.trim();scrollTo(0,0)}function paint(){document.querySelectorAll('[data-p]').forEach(e=>{if(live[e.dataset.p])e.textContent=fmt(live[e.dataset.p])});document.querySelectorAll('[data-plan-p]').forEach(e=>{if(live[e.dataset.planP])e.textContent=fmt(live[e.dataset.planP])})}function ws(){let w=new WebSocket('wss://ws.okx.com:8443/ws/v5/public');w.onopen=()=>w.send(JSON.stringify({op:'subscribe',args:U.map(instId=>({channel:'tickers',instId}))}));w.onmessage=e=>{try{JSON.parse(e.data).data?.forEach(x=>live[x.instId]=+x.last);paint();paintOpenPnl();if(db.open){let o=db.open,p=live[o.sym];if(p){let r=Math.abs(o.entry-(o.initialSl||o.sl))||1;o.maxPrice=Math.max(o.maxPrice||o.entry,p);o.minPrice=Math.min(o.minPrice||o.entry,p);o.mfe=Math.max(o.mfe||0,o.side==='LONG'?o.maxPrice-o.entry:o.entry-o.minPrice);o.mfeR=o.mfe/r;o.curR=(o.side==='LONG'?p-o.entry:o.entry-p)/r;let qty=((o.marginU||0)*(o.leverage||1))/(o.entry||1);o.livePnl=(o.side==='LONG'?p-o.entry:o.entry-p)*qty;o.livePnlPct=o.marginU?o.livePnl/o.marginU*100:0;renderJournal()}}}catch(_){}};w.onclose=()=>setTimeout(ws,2500)}renderJournal();tickHoldTimes();setInterval(tickHoldTimes,1000);scan();ws();let evalBusy=false,scanBusy=false;setInterval(async()=>{if(document.visibilityState!=='visible'||!db.opens.length||evalBusy)return;evalBusy=true;try{await evalOpen()}catch(e){console.warn('evalOpen',e)}finally{evalBusy=false}},15000);setInterval(async()=>{if(document.visibilityState!=='visible'||scanBusy)return;scanBusy=true;try{await scan()}catch(e){console.warn('scan',e)}finally{scanBusy=false}},60000);
