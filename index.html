<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0f"><link rel="manifest" href="./manifest.webmanifest"><title>SINKA DATA HUNTER</title><style>
:root{--bg:#05070b;--panel:#0b1119;--panel2:#0e1621;--line:#1d2a38;--gold:#d9b86c;--cyan:#50d7ff;--green:#43e6a0;--red:#ff6378;--mut:#7f91a6}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 50% -20%,#142238 0,#070b12 38%,#040609 75%);color:#edf4fb;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:84px;min-height:100vh}header{position:sticky;top:0;z-index:20;background:#05080ddd;backdrop-filter:blur(16px);border-bottom:1px solid #1a2633;padding:14px 22px}.head{max-width:1280px;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{font-size:19px;font-weight:950;letter-spacing:1.6px}.brand:before{content:"◈";color:var(--gold);margin-right:9px}.ver{font-size:10px;color:var(--cyan);letter-spacing:1.2px}.mut{font-size:11px;color:var(--mut)}main{max-width:1280px;margin:auto;padding:22px}.card{background:linear-gradient(180deg,#0c131dE8,#080d14E8);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 14px 40px #0005}h2{font-size:13px;text-transform:uppercase;letter-spacing:1.1px;color:#a9b9ca;margin:0 0 13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#070c12;border:1px solid #172431;border-radius:10px;padding:12px}.metric span{display:block}.metric b{display:block;font-size:15px;margin-top:5px}.scan{position:relative;overflow:hidden;border:1px solid #314258;border-radius:12px;padding:18px;background:linear-gradient(135deg,#0b141f,#081018)}.scan:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#50d7ff08,transparent);pointer-events:none}.scanHead,.pickTop{display:flex;justify-content:space-between;align-items:center;gap:8px}.badge{font-size:9px;font-weight:900;letter-spacing:.7px;color:var(--gold);border:1px solid #6a5731;border-radius:6px;padding:5px 8px;background:#211b0d}.live{font-size:34px;font-weight:950;letter-spacing:-1px;margin:10px 0;color:#fff}.action{border:1px solid #183445;border-left:3px solid var(--cyan);background:#071018;border-radius:8px;padding:11px;line-height:1.55;margin-top:11px}.pick{border:1px solid #182635;background:#080e16;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer;transition:.18s}.pick:hover{border-color:#35516b;transform:translateY(-1px);background:#0b131d}.stats{font-size:11px;color:#8fa2b7;line-height:1.65;margin-top:6px}.green{color:var(--green)}.red{color:var(--red)}button{width:100%;padding:12px;border:1px solid #745f35;border-radius:9px;margin-top:10px;font-weight:900;background:linear-gradient(135deg,#e0bf72,#8c6b2e);color:#07090c;cursor:pointer}.sec{background:#101923;color:#dbe7f1;border:1px solid #29394b}input,select,textarea{width:100%;margin-top:5px;background:#060a10;color:#f4f8fc;border:1px solid #26384b;border-radius:8px;padding:11px;font-size:15px}label{font-size:10px;color:#8194aa}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.page{display:none}.page.on{display:block}.trade{border-top:1px solid #172431;padding:11px 0}nav{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:30;width:min(620px,calc(100% - 22px));display:flex;gap:5px;padding:6px;background:#080d14eF;border:1px solid #243242;border-radius:13px;backdrop-filter:blur(14px);box-shadow:0 12px 30px #0009}nav button{margin:0;background:transparent;color:#718399;border:0;padding:10px}nav button.on{color:#fff;background:#111b27;box-shadow:inset 0 -2px var(--gold)}
#top3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}#top3 h2{grid-column:1/-1;margin:3px 0}.pick{margin:0}
@media(max-width:700px){main{padding:11px}.grid{grid-template-columns:1fr 1fr}#top3{grid-template-columns:1fr}.brand{font-size:15px}.live{font-size:29px}header{padding:12px}.row{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div class="head"><div class="brand">SINKA DATA HUNTER</div><div class="ver">V3.1 · HUNTER UI</div></div></header><main>
<section id="market" class="page on"><div class="card"><h2>市場雷達</h2><div id="marketPulse" class="grid"><div class="metric"><span class="mut">掃描市場</span><b>OKX USDT SWAP</b></div><div class="metric"><span class="mut">策略</span><b>Trend Pullback</b></div><div class="metric"><span class="mut">訊號</span><b>Hard Gate</b></div><div class="metric"><span class="mut">執行</span><b>SIM / REAL</b></div></div></div><div class="card"><h2>高確認交易掃描 <span id="scanTime" class="mut" style="float:right">—</span></h2><div id="best" class="scan"><div class="mut">正在連線 OKX...</div></div><button id="scanBtn" onclick="scanMarket()">重新掃描市場</button><div id="top3"></div></div></section>
<section id="tradeP" class="page"><div class="card"><h2>建立交易</h2><div id="setup" class="action">先從市場頁選擇候選標的。</div><div class="row"><label>交易類型<select id="type"><option value="SIM">模擬</option><option value="REAL">真實</option></select></label><label>方向<select id="side"><option>LONG</option><option>SHORT</option></select></label></div><div class="row"><label>實際 Entry<input id="entry" type="number" step="any"></label><label>SL<input id="sl" type="number" step="any"></label></div><label style="display:block;margin-top:8px">TP<input id="tp" type="number" step="any"></label><button onclick="createTrade()">建立交易紀錄</button></div><div class="card"><h2>目前交易</h2><div id="openBox" class="mut">目前沒有交易。</div></div></section>
<section id="journal" class="page"><div class="card"><h2>平倉</h2><div class="row"><label>實際 Exit<input id="exit" type="number" step="any"></label><label>淨損益 USDT<input id="pnl" type="number" step="any"></label></div><label style="display:block;margin-top:8px">備註<textarea id="note"></textarea></label><button onclick="closeTrade()">完成平倉</button><div id="review" class="action">平倉後會依進場時的 Setup 品質給出檢討。</div></div><div class="card"><h2>交易統計</h2><div id="summary"></div></div><div class="card"><h2>交易紀錄</h2><div id="history" class="mut">尚無交易。</div></div></section></main>
<nav><button class="on" onclick="page('market',this)">市場雷達</button><button onclick="page('tradeP',this)">交易計畫</button><button onclick="page('journal',this)">紀錄學習</button></nav>
<script>
const VERSION="V3.0",OKX='https://www.okx.com',KEY='sinka-trade-v23';let legacy=JSON.parse(localStorage.getItem('sinka2k-v2')||'null'),db=JSON.parse(localStorage.getItem(KEY)||'null')||{trades:legacy?.trades||[],open:legacy?.open||null,cand:null};let rows=[],live={},ws=null,selected='';
const universe=['BTC-USDT-SWAP','ETH-USDT-SWAP','SOL-USDT-SWAP','XRP-USDT-SWAP','DOGE-USDT-SWAP','ADA-USDT-SWAP','AVAX-USDT-SWAP','LINK-USDT-SWAP','SUI-USDT-SWAP','LTC-USDT-SWAP','BCH-USDT-SWAP','DOT-USDT-SWAP','UNI-USDT-SWAP','APT-USDT-SWAP','NEAR-USDT-SWAP','ARB-USDT-SWAP','OP-USDT-SWAP','FIL-USDT-SWAP','ETC-USDT-SWAP','AAVE-USDT-SWAP','ATOM-USDT-SWAP','TRX-USDT-SWAP','TON-USDT-SWAP','PEPE-USDT-SWAP','WLD-USDT-SWAP','CRV-USDT-SWAP','ENA-USDT-SWAP','ONDO-USDT-SWAP','TAO-USDT-SWAP','HBAR-USDT-SWAP'];
const fmt=x=>{x=+x;return x>=1000?x.toFixed(1):x>=1?x.toFixed(3):x.toPrecision(5)};function save(){localStorage.setItem(KEY,JSON.stringify(db))}function sma(a,n){return a.slice(-n).reduce((s,x)=>s+x,0)/n}async function okx(p){let r=await fetch(OKX+p,{cache:'no-store'}),j=await r.json();if(!r.ok||j.code!=='0')throw Error(j.msg||r.status);return j.data}async function candles(id,bar){let d=await okx('/api/v5/market/candles?instId='+id+'&bar='+bar+'&limit=50');return d.reverse().map(x=>({o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5],confirm:x[8]})).filter(x=>x.confirm==='1')}
async function analyze(id,t){let[h,m,f,oi]=await Promise.all([candles(id,'1H'),candles(id,'15m'),candles(id,'5m'),okx('/api/v5/public/open-interest?instType=SWAP&instId='+id).catch(()=>[])]);let hc=h.map(x=>x.c),mc=m.map(x=>x.c),fc=f.map(x=>x.c),last=+t.last,h7=sma(hc,7),h25=sma(hc,25),m7=sma(mc,7),m25=sma(mc,25),f7=sma(fc,7),f25=sma(fc,25),atr=h.slice(-14).reduce((s,x)=>s+x.h-x.l,0)/14,chg=(last-+t.open24h)/(+t.open24h)*100,vr=f.at(-1).v/(f.slice(-11,-1).reduce((s,x)=>s+x.v,0)/10||1),bv=f.slice(-6).reduce((s,x)=>s+(x.c>=x.o?x.v:0),0),sv=f.slice(-6).reduce((s,x)=>s+(x.c<x.o?x.v:0),0),flow=(bv-sv)/(bv+sv||1);let L=h7>h25&&m7>m25,S=h7<h25&&m7<m25;if(!L&&!S)return null;let side=L?'LONG':'SHORT',zone=(side==='LONG'?[Math.max(h7,last-atr*.65),Math.max(h7,last-atr*.2)]:[Math.min(h7,last+atr*.2),Math.min(h7,last+atr*.65)]).sort((a,b)=>a-b),inside=last>=zone[0]&&last<=zone[1],near=side==='LONG'?(last>zone[1]&&last<=zone[1]+atr*.35):(last<zone[0]&&last>=zone[0]-atr*.35),flowOK=side==='LONG'?flow>-.12:flow<.12,confirm=(side==='LONG'?f7>f25&&f.at(-1).c>f7:f7<f25&&f.at(-1).c<f7)&&vr>=.75&&flowOK,ab=Math.abs(chg)>14||atr/last*100>7||vr>5,state=ab?'NO TRADE':inside?(confirm?'ENTRY READY':'ARMED'):near?'WATCH':'WAIT',swingL=Math.min(...m.slice(-12).map(x=>x.l)),swingH=Math.max(...m.slice(-12).map(x=>x.h)),slv=side==='LONG'?Math.min(swingL,zone[0]-atr*.2):Math.max(swingH,zone[1]+atr*.2),risk=Math.abs(last-slv),tpv=side==='LONG'?last+risk*1.8:last-risk*1.8,quality=(L||S?40:0)+(Math.abs(last-h7)/atr<1.2?20:8)+(vr>=.75&&vr<=3?15:5)+(flowOK?15:0)+(Math.abs(chg)<8?10:3);return{id,side,last,zone,sl:slv,tp:tpv,state,quality,chg,vr,flow,flowOK,oiUsd:oi[0]?+(oi[0].oiUsd||0):0}}
function act(x){if(x.state==='ENTRY READY')return '<b class="green">ENTRY READY</b>：回踩到位，5m 與成交主動性已重新同向。';if(x.state==='ARMED')return '<b>ARMED</b>：已進回踩區，等 5m 收盤確認。';if(x.state==='WATCH')return '<b>WATCH</b>：接近回踩區，不追價。';return '<b>WAIT</b>：趨勢成立，但位置還沒到。'}
async function scanMarket(){scanBtn.disabled=true;best.innerHTML='<div class="mut">正在掃描 OKX...</div>';try{let ticks=await okx('/api/v5/market/tickers?instType=SWAP'),map=Object.fromEntries(ticks.map(x=>[x.instId,x])),a=[];for(let i=0;i<universe.length;i+=5){let z=await Promise.all(universe.slice(i,i+5).map(id=>map[id]?analyze(id,map[id]).catch(()=>null):null));a.push(...z.filter(Boolean))}let rank={'ENTRY READY':4,ARMED:3,WATCH:2,WAIT:1};rows=a.filter(x=>x.state!=='NO TRADE').sort((a,b)=>(rank[b.state]-rank[a.state])||(b.quality-a.quality)).slice(0,8);renderScan()}catch(e){best.innerHTML='<b class="red">掃描失敗</b><div class="mut">'+e.message+'</div>'}scanTime.textContent=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});scanBtn.disabled=false}
function detail(x){let rr=Math.abs(x.tp-x.last)/Math.abs(x.last-x.sl);return '品質 '+x.quality+'/100｜R:R 1:'+rr.toFixed(2)+'<br>回踩 '+fmt(x.zone[0])+'～'+fmt(x.zone[1])+'｜SL '+fmt(x.sl)+'｜TP '+fmt(x.tp)+'<br>資金流 '+(x.flowOK?'同向':'未確認')+'｜CVD proxy '+(x.flow*100).toFixed(1)+'%｜OI '+(x.oiUsd?'$'+(x.oiUsd/1e6).toFixed(1)+'M':'—')}
function renderScan(){if(!rows.length){best.innerHTML='<b>NO TRADE</b><div class="action">目前沒有符合條件的高確認交易。</div>';top3.innerHTML='';return}let b=rows[0];best.innerHTML='<div class="scanHead"><b>'+b.id+' · '+b.side+'</b><span class="badge">'+b.state+'</span></div><div class="live" data-live="'+b.id+'">'+fmt(live[b.id]||b.last)+'</div><div class="stats">'+detail(b)+'</div><div class="action">'+act(b)+'</div>';top3.innerHTML='<h2 style="margin-top:14px">推薦排行 · TOP '+Math.min(8,rows.length)+'</h2>'+rows.map((x,i)=>'<div class="pick" onclick="pick('+i+')"><div class="pickTop"><b>#'+(i+1)+' '+x.id+' · '+x.side+'</b><span class="badge">'+x.state+'</span></div><div class="stats">OKX LIVE <span data-live="'+x.id+'">'+fmt(live[x.id]||x.last)+'</span>｜24H '+x.chg.toFixed(2)+'%<br>'+detail(x)+'</div></div>').join('')}
function pick(i){let x=rows[i];selected=x.id;db.cand=x;save();setup.innerHTML='<b>'+x.id+' · '+x.side+' · '+x.state+'</b><br>'+act(x);entry.value=live[x.id]||x.last;side.value=x.side;sl.value=x.sl;tp.value=x.tp;page('tradeP',document.querySelectorAll('nav button')[1])}
function paint(){document.querySelectorAll('[data-live]').forEach(e=>{if(live[e.dataset.live])e.textContent=fmt(live[e.dataset.live])})}async function poll(){try{let t=await okx('/api/v5/market/tickers?instType=SWAP');t.forEach(x=>{if(universe.includes(x.instId))live[x.instId]=+x.last});paint()}catch(e){}}function connect(){try{ws?.close()}catch(e){}ws=new WebSocket('wss://ws.okx.com:8443/ws/v5/public');ws.onopen=()=>ws.send(JSON.stringify({op:'subscribe',args:universe.map(instId=>({channel:'tickers',instId}))}));ws.onmessage=e=>{try{let j=JSON.parse(e.data);j.data?.forEach(x=>live[x.instId]=+x.last);paint()}catch(_){}};ws.onclose=()=>setTimeout(connect,2500)}
function createTrade(){if(db.open)return alert('已有一筆未平倉交易');let e=+entry.value,s=+sl.value,t=+tp.value,di=side.value;if(!(e&&s&&t&&(di==='LONG'?s<e&&t>e:s>e&&t<e)))return alert('Entry / SL / TP 不合理');let risk=Math.abs(e-s),rr=Math.abs(t-e)/risk,x=db.cand||{};db.open={sym:x.id||'',type:type.value,side:di,entry:e,sl:s,tp:t,rr,setupState:x.state||'',quality:x.quality||0,flow:x.flow||0,flowOK:x.flowOK||false,oiUsd:x.oiUsd||0,opened:Date.now()};save();renderOpen();page('journal',document.querySelectorAll('nav button')[2])}
function renderOpen(){if(!db.open){openBox.textContent='目前沒有交易。';return}let o=db.open;openBox.innerHTML='<b>'+o.type+'｜'+o.sym+' '+o.side+'</b><br>Entry '+o.entry+'｜SL '+o.sl+'｜TP '+o.tp+'｜R:R 1:'+o.rr.toFixed(2)}
function closeTrade(){if(!db.open)return alert('目前沒有交易');let ex=+exit.value,p=+pnl.value;if(!ex||!Number.isFinite(p))return alert('請輸入 Exit 與淨損益');let o=db.open,risk=Math.abs(o.entry-o.sl),realR=(o.side==='LONG'?(ex-o.entry):(o.entry-ex))/risk,score=Math.min(100,Math.round((o.setupState==='ENTRY READY'?45:o.setupState==='ARMED'?30:o.setupState==='WATCH'?18:8)+(o.rr>=1.5?20:8)+(o.flowOK?20:5)+15));let t={...o,exit:ex,pnl:p,R:realR,score,note:note.value,closed:Date.now()};db.trades.unshift(t);db.open=null;save();review.innerHTML='<b>交易品質 '+score+'/100｜'+(realR>=0?'+':'')+realR.toFixed(2)+'R</b><br>'+(score>=80?'流程品質高，下一筆維持相同等待與確認標準。':score>=65?'流程合格；下一筆優先等 ENTRY READY 再執行。':'這筆流程品質偏低；下一筆不要提前進場，只做完整回踩確認。');exit.value='';pnl.value='';note.value='';renderOpen();renderStats();renderHistory()}
function renderStats(){let a=db.trades,n=a.length;if(!n){summary.innerHTML='<div class="mut">尚無樣本。模擬與真實交易都會累積統計。</div>';return}let w=a.filter(x=>x.R>0).length,sim=a.filter(x=>x.type==='SIM'),real=a.filter(x=>x.type==='REAL'),avg=a.reduce((s,x)=>s+x.R,0)/n,pf=Math.abs(a.filter(x=>x.R<0).reduce((s,x)=>s+x.R,0));let rate=z=>z.length?(z.filter(x=>x.R>0).length/z.length*100).toFixed(1)+'%':'—';summary.innerHTML='<div class="grid"><div class="metric"><span class="mut">總勝率</span><b>'+rate(a)+' · '+n+'筆</b></div><div class="metric"><span class="mut">平均 R / EV</span><b>'+avg.toFixed(2)+'R</b></div><div class="metric"><span class="mut">模擬勝率</span><b>'+rate(sim)+' · '+sim.length+'筆</b></div><div class="metric"><span class="mut">真實勝率</span><b>'+rate(real)+' · '+real.length+'筆</b></div></div>'}
function renderHistory(){history.innerHTML=db.trades.length?db.trades.map(x=>'<div class="trade"><b>'+x.type+'｜'+x.sym+' '+x.side+'</b>　<span class="'+(x.R>0?'green':'red')+'">'+(x.R>0?'+':'')+x.R.toFixed(2)+'R</span><div class="mut">品質 '+x.score+'/100｜'+new Date(x.closed).toLocaleString('zh-TW')+(x.note?'｜'+x.note:'')+'</div></div>').join(''):'尚無交易。'}
function page(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');scrollTo(0,0)}renderOpen();renderStats();renderHistory();connect();poll();setInterval(poll,2000);setTimeout(scanMarket,500);setInterval(()=>{if(document.visibilityState==='visible')scanMarket()},60000);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
