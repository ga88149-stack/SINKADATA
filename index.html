function go(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('.nav').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('title').textContent=b.textContent.trim();scrollTo(0,0)}function paint(){document.querySelectorAll('[data-p]').forEach(e=>{if(live[e.dataset.p])e.textContent=fmt(live[e.dataset.p])});document.querySelectorAll('[data-plan-p]').forEach(e=>{if(live[e.dataset.planP])e.textContent=fmt(live[e.dataset.planP])})}function ws(){let w=new WebSocket('wss://ws.okx.com:8443/ws/v5/public');let ping=setInterval(()=>{if(w.readyState===1)w.send('ping')},20000);w.onopen=()=>w.send(JSON.stringify({op:'subscribe',args:U.map(instId=>({channel:'tickers',instId}))}));w.onmessage=e=>{try{JSON.parse(e.data).data?.forEach(x=>live[x.instId]=+x.last);paint();paintOpenPnl();if(db.open){let o=db.open,p=live[o.sym];if(p){let r=Math.abs(o.entry-(o.initialSl||o.sl))||1;o.maxPrice=Math.max(o.maxPrice||o.entry,p);o.minPrice=Math.min(o.minPrice||o.entry,p);o.mfe=Math.max(o.mfe||0,o.side==='LONG'?o.maxPrice-o.entry:o.entry-o.minPrice);o.mfeR=o.mfe/r;o.curR=(o.side==='LONG'?p-o.entry:o.entry-p)/r;let qty=((o.marginU||0)*(o.leverage||1))/(o.entry||1);o.livePnl=(o.side==='LONG'?p-o.entry:o.entry-p)*qty;o.livePnlPct=o.marginU?o.livePnl/o.marginU*100:0;renderJournal()}}}catch(_){}};w.onclose=()=>{clearInterval(ping);setTimeout(ws,2500)};w.onerror=()=>{try{w.close()}catch(_){}}}renderJournal();tickHoldTimes();setInterval(tickHoldTimes,1000);scan();ws();let evalBusy=false,scanBusy=false;setInterval(async()=>{if(document.visibilityState!=='visible'||!db.opens.length||evalBusy)return;evalBusy=true;try{await evalOpen()}catch(e){console.warn('evalOpen',e)}finally{evalBusy=false}},15000);setInterval(async()=>{if(document.visibilityState!=='visible'||scanBusy)return;scanBusy=true;try{await scan()}catch(e){console.warn('scan',e)}finally{scanBusy=false}},60000);
