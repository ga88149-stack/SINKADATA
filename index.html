async function api(p){let r=await fetch(API+p,{cache:'no-store'}),j=await r.json();if(j.code!=='0')throw Error(j.msg);return j.data}async function cs(id,b){let d=await api('/api/v5/market/candles?instId='+id+'&bar='+b+'&limit=60');return d.reverse().map(x=>({o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5],q:x[8]})).filter(x=>x.q==='1')}
async function ana(id,t){let[h,m,f,oi]=await Promise.all([cs(id,'1H'),cs(id,'15m'),cs(id,'5m'),api('/api/v5/public/open-interest?instType=SWAP&instId='+id).catch(()=>[])]);if(h.length<25||m.length<25||f.length<25)return null;let hc=h.map(x=>x.c),mc=m.map(x=>x.c),fc=f.map(x=>x.c),last=+t.last,h7=sma(hc,7),h25=sma(hc,25),m7=sma(mc,7),m25=sma(mc,25),f7=sma(fc,7),f25=sma(fc,25),atr=h.slice(-14).reduce((s,x)=>s+x.h-x.l,0)/14,vr=f.at(-1).v/(f.slice(-11,-1).reduce((s,x)=>s+x.v,0)/10||1),bv=f.slice(-6).reduce((s,x)=>s+(x.c>=x.o?x.v:0),0),sv=f.slice(-6).reduce((s,x)=>s+(x.c<x.o?x.v:0),0),flow=(bv-sv)/(bv+sv||1),chg=(last-+t.open24h)/+t.open24h*100,L=h7>h25&&m7>m25,S=h7<h25&&m7<m25;if(!L&&!S)return null;let side=L?'LONG':'SHORT',zone=(side==='LONG'?[h7-atr*.15,h7+atr*.25]:[h7-atr*.25,h7+atr*.15]).sort((a,b)=>a-b),inside=last>=zone[0]&&last<=zone[1],near=Math.min(Math.abs(last-zone[0]),Math.abs(last-zone[1]))<atr*.45,flowOK=side==='LONG'?flow>0:flow<0,trigger=side==='LONG'?f7>f25&&f.at(-1).c>f7:f7<f25&&f.at(-1).c<f7,ab=Math.abs(chg)>14||atr/last*100>7||vr>5,state=ab?'NO TRADE':inside&&trigger&&flowOK&&vr>=.8?'ENTRY READY':inside?'ARMED':near?'WATCH':'WAIT',lo=Math.min(...m.slice(-12).map(x=>x.l)),hi=Math.max(...m.slice(-12).map(x=>x.h)),sl=side==='LONG'?Math.min(lo,zone[0]-atr*.1):Math.max(hi,zone[1]+atr*.1),risk=Math.abs(last-sl),target=side==='LONG'?Math.max(...m.slice(-20).map(x=>x.h)):Math.min(...m.slice(-20).map(x=>x.l)),tp=(side==='LONG'?target>last:target<last)?target:(side==='LONG'?last+risk*1.5:last-risk*1.5),rr=Math.abs(tp-last)/risk,quality=Math.min(100,35+(inside?20:near?10:0)+(trigger?15:0)+(flowOK?15:0)+(vr>=.8&&vr<3?10:0)+(rr>=1.2?5:0));return{id,side,last,chg,vr,flow,flowOK,zone,sl,tp,rr,quality,state,oi:oi[0]?+(oi[0].oiUsd||0):0,gates:[L||S,inside,trigger,flowOK,vr>=.8,rr>=1.2]}}
function gates(x){let n=['趨勢','回踩','5m','FLOW','量能','R:R'];return '<div class="gates">'+n.map((z,i)=>'<span class="gate '+(x.gates[i]?'ok':'')+'">'+z+'</span>').join('')+'</div>'}function choose(i){db.cand=rows[i];save();let x=rows[i];$('planSym').textContent=x.id;$('side').value=x.side;$('entry').value=live[x.id]||x.last;$('sl').value=x.sl;$('tp').value=x.tp;$('planLive').innerHTML='<span class="mut">OKX LIVE · '+x.id+'</span><b data-plan-p="'+x.id+'">'+fmt(live[x.id]||x.last)+'</b>';$('setup').innerHTML='<b class="'+(x.side==='LONG'?'long':'short')+'">'+x.id+' '+x.side+' · '+x.state+'</b>'+gates(x);calcRisk();go('plan',document.querySelectorAll('.nav')[2])}

async function scan(){try{let t=await api('/api/v5/market/tickers?instType=SWAP'),map=Object.fromEntries(t.map(x=>[x.instId,x]));U.forEach(id=>{if(map[id])live[id]=+map[id].last});$('ticker').innerHTML=['BTC','ETH','SOL','XRP','DOGE'].map(s=>{let id=s+'-USDT-SWAP',q=map[id],chg=q?(+q.last-+q.open24h)/+q.open24h*100:0;return '<div class="tile"><small>'+s+' / USDT</small><b data-p="'+id+'">'+fmt(live[id])+'</b><span class="'+(chg>=0?'long':'short')+'">'+chg.toFixed(2)+'%</span></div>'}).join('');let a=[];for(let i=0;i<U.length;i+=4){let z=await Promise.all(U.slice(i,i+4).map(id=>map[id]?ana(id,map[id]).catch(()=>null):null));a.push(...z.filter(Boolean))}let rank={'ENTRY READY':4,ARMED:3,WATCH:2,WAIT:1,'NO TRADE':0};rows=a.filter(x=>x.state!=='NO TRADE').sort((a,b)=>(rank[b.state]-rank[a.state])||(b.quality-a.quality)).slice(0,15);render();let btc=map['BTC-USDT-SWAP'],bc=btc?(+btc.last-+btc.open24h)/+btc.open24h*100:0;$('context').innerHTML='<b>BTC 24H <span class="'+(bc>=0?'long':'short')+'">'+bc.toFixed(2)+'%</span></b><br><br>ALT 訊號需搭配 BTC 方向與異常波動判讀。';$('time').textContent=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}catch(e){$('scanRows').innerHTML='<tr><td colspan="9">'+e.message+'</td></tr>'}}
function calcRisk(){let e=+$('entry').value,s=+$('sl').value,t=+$('tp').value,u=+$('riskU').value,m=+$('marginU').value,l=+$('lev').value;if(!e||!s||!t||!u||!m||!l)return;let d=Math.abs(e-s),rr=Math.abs(t-e)/d,notional=m*l,qty=notional/e,loss=qty*d,profit=qty*Math.abs(t-e),riskPct=d/e*100,tpPct=Math.abs(t-e)/e*100;$('riskBox').innerHTML='<div class="stats"><div class="stat"><span class="mut">投入保證金</span><b>'+m.toFixed(2)+'U</b></div><div class="stat"><span class="mut">槓桿 / 部位</span><b>'+l+'× / '+notional.toFixed(2)+'U</b></div><div class="stat"><span class="mut">SL 預估虧損</span><b class="short">-'+loss.toFixed(2)+'U</b><small class="mut">價格 '+riskPct.toFixed(2)+'%</small></div><div class="stat"><span class="mut">TP 預估獲利</span><b class="long">+'+profit.toFixed(2)+'U</b><small class="mut">價格 '+tpPct.toFixed(2)+'%</small></div></div><div style="margin-top:10px">R:R <b>1:'+rr.toFixed(2)+'</b>　'+(loss<=u?'<span class="long">✓ 未超過最大虧損 '+u.toFixed(2)+'U</span>':'<span class="short">⚠ 目前 SL 會虧 '+loss.toFixed(2)+'U，超過你設定的 '+u.toFixed(2)+'U</span>')+'</div>'}['entry','sl','tp','riskU','marginU','lev'].forEach(id=>$(id).addEventListener('input',calcRisk));
function createTrade(){if(db.open)return alert('已有持倉');let x=db.cand,e=+$('entry').value,s=+$('sl').value,t=+$('tp').value,di=$('side').value;if(!x||!e||!s||!t)return alert('請先選擇標的');db.open={sym:x.id,type:$('type').value,side:di,entry:e,sl:s,tp:t,initialSl:s,riskU:+$('riskU').value,quality:x.quality,state:x.state,gates:x.gates,opened:Date.now(),entryConfidence:x.quality,currentConfidence:x.quality,mfe:0,mfeR:0,maxPrice:e,minPrice:e,protect:false,exitStatus:'HOLD',exitReason:'',lastEval:Date.now()};save();renderJournal();go('journal',document.querySelectorAll('.nav')[3])}function closeTrade(auto=false){if(!db.open)return alert('目前無持倉');let o=db.open,ex=auto?(live[o.sym]||o.entry):+$('exit').value,p=+$('pnl').value;if(!ex)return alert('輸入 Exit');let baseRisk=Math.abs(o.entry-(o.initialSl||o.sl))||1,R=(o.side==='LONG'?ex-o.entry:o.entry-ex)/baseRisk;if(auto&&!Number.isFinite(p))p=0;if(!auto&&!Number.isFinite(p))return alert('輸入損益');db.trades.unshift({...o,exit:ex,pnl:p,R,mfeR:o.mfeR||0,gaveBack:(o.mfeR||0)>0&&R<=0,exitReason:o.exitReason||'手動平倉',closed:Date.now()});db.open=null;save();renderJournal()}
function protectProfit(){if(!db.open)return;let o=db.open,p=live[o.sym]||o.entry,risk=Math.abs(o.entry-(o.initialSl||o.sl))||1;if((o.mfeR||0)<.5)return alert('尚未達 +0.5R，不建議過早鎖利');let lockR=o.mfeR>=1?.35:.08,o2=o.side==='LONG'?o.entry+risk*lockR:o.entry-risk*lockR;o.sl=o.side==='LONG'?Math.max(o.sl,o2):Math.min(o.sl,o2);o.protect=true;o.exitReason='浮盈保護啟動';save();renderJournal()}

async function evalOpen(){let o=db.open;if(!o)return;let p=live[o.sym];if(!p)return;let baseRisk=Math.abs(o.entry-(o.initialSl||o.sl))||1;o.maxPrice=Math.max(o.maxPrice||o.entry,p);o.minPrice=Math.min(o.minPrice||o.entry,p);let favorable=o.side==='LONG'?o.maxPrice-o.entry:o.entry-o.minPrice;o.mfe=Math.max(o.mfe||0,favorable);o.mfeR=o.mfe/baseRisk;let curR=(o.side==='LONG'?p-o.entry:o.entry-p)/baseRisk,age=(Date.now()-o.opened)/60000,dd=o.mfeR>0?o.mfeR-curR:0;

let conf=o.currentConfidence??o.entryConfidence??50,drop=(o.entryConfidence||o.quality||50)-conf,status='HOLD',reason='趨勢仍支持原方向';
if(curR<=-1){status='EXIT';reason='已觸及原始風險區';}
else if(o.mfeR>=.5&&curR<=0){status='EXIT';reason='曾有 +'+o.mfeR.toFixed(2)+'R 浮盈，現已全部回吐';}
else if(o.mfeR>=1&&dd>=.55){status='EXIT';reason='高點回撤 '+dd.toFixed(2)+'R，浮盈快速流失';}
else if(o.structureSame===false&&conf<45){status='EXIT';reason='多週期結構已反向，原進場邏輯失效';}
else if(age>=30&&curR<.35){status='EXIT';reason='Time Stop：持倉 '+Math.round(age)+' 分鐘仍未有效延伸';}
else if((drop>=18||conf<55)&&o.mfeR>=.35){status='PROTECT';reason='訊號信心下降，優先保護既有浮盈';}
else if(o.mfeR>=.7&&dd>=.3){status='PROTECT';reason='浮盈回撤 '+dd.toFixed(2)+'R，建議上移止損';}
else if(age>=20&&curR<.2){status='WATCH';reason='接近訊號有效時間，尚未產生足夠延伸';}
o.exitStatus=status;o.exitReason=reason;o.curR=curR;o.drawdownR=dd;o.ageMin=age;o.lastEval=Date.now();save();renderJournal()}
function renderJournal(){let a=db.trades,rate=z=>z.length?(z.filter(x=>x.R>0).length/z.length*100).toFixed(1)+'%':'—',avg=a.length?a.reduce((s,x)=>s+x.R,0)/a.length:0;$('stats').innerHTML='<div class="stat"><span class="mut">總交易</span><b>'+a.length+'</b></div><div class="stat"><span class="mut">勝率</span><b>'+rate(a)+'</b></div><div class="stat"><span class="mut">平均 R</span><b>'+avg.toFixed(2)+'</b></div><div class="stat"><span class="mut">浮盈轉虧</span><b>'+a.filter(x=>x.gaveBack).length+'</b></div>';$('openBox').innerHTML=db.open?'<b>'+db.open.type+' · '+db.open.sym+' '+db.open.side+'</b><br>Entry '+fmt(db.open.entry)+' · SL '+fmt(db.open.sl)+' · TP '+fmt(db.open.tp)+' · LIVE '+fmt(live[db.open.sym]||db.open.entry):'無';let o=db.open;if(o){let cls=o.exitStatus==='EXIT'?'exitnow':o.exitStatus==='PROTECT'||o.exitStatus==='WATCH'?'warn':'good',lab=o.exitStatus==='EXIT'?'建議退出':o.exitStatus==='PROTECT'?'保護獲利':o.exitStatus==='WATCH'?'密切觀察':'續抱';$('manageBox').innerHTML='<div class="manage '+cls+'"><div class="exitBadge">'+lab+' · '+(o.exitReason||'監控中')+'</div><div class="manageGrid"><span>目前 R<b>'+(o.curR>=0?'+':'')+(o.curR||0).toFixed(2)+'R</b></span><span>最大浮盈 MFE<b>+'+(o.mfeR||0).toFixed(2)+'R</b></span><span>浮盈回撤<b>'+(o.drawdownR||0).toFixed(2)+'R</b></span><span>訊號信心<b>'+(o.entryConfidence||o.quality)+' → '+(o.currentConfidence??'—')+'</b></span><span>持倉時間<b>'+Math.round(o.ageMin||((Date.now()-o.opened)/60000))+'m</b></span><span>動態 SL<b>'+fmt(o.sl)+'</b></span><span>結構方向<b>'+(o.structureSame===false?'已反向':o.structureSame===true?'同向':'計算中')+'</b></span><span>狀態<b>'+o.exitStatus+'</b></span></div><div class="manageActions"><button onclick="protectProfit()">啟動浮盈保護</button><button class="dangerBtn" onclick="exitNow()">依目前價退出</button></div></div>'}else $('manageBox').innerHTML='';$('history').innerHTML=a.length?a.map(x=>'<div class="trade"><b>'+x.type+' · '+x.sym+' '+x.side+'</b>　<span class="'+(x.R>=0?'long':'short')+'">'+(x.R>=0?'+':'')+x.R.toFixed(2)+'R</span><div class="mut">Setup '+x.quality+'/100 · MFE +'+(x.mfeR||0).toFixed(2)+'R · '+(x.exitReason||'手動平倉')+' · '+new Date(x.closed).toLocaleString('zh-TW')+'</div></div>').join(''):'尚無紀錄'}
function go(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('.nav').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('title').textContent=b.textContent.trim();scrollTo(0,0)}function paint(){document.querySelectorAll('[data-p]').forEach(e=>{if(live[e.dataset.p])e.textContent=fmt(live[e.dataset.p])});document.querySelectorAll('[data-plan-p]').forEach(e=>{if(live[e.dataset.planP])e.textContent=fmt(live[e.dataset.planP])})}function ws(){let w=new WebSocket('wss://ws.okx.com:8443/ws/v5/public');w.onopen=()=>w.send(JSON.stringify({op:'subscribe',args:U.map(instId=>({channel:'tickers',instId}))}));w.onmessage=e=>{try{JSON.parse(e.data).data?.forEach(x=>live[x.instId]=+x.last);paint();if(db.open){let o=db.open,p=live[o.sym];if(p){let r=Math.abs(o.entry-(o.initialSl||o.sl))||1;o.maxPrice=Math.max(o.maxPrice||o.entry,p);o.minPrice=Math.min(o.minPrice||o.entry,p);o.mfe=Math.max(o.mfe||0,o.side==='LONG'?o.maxPrice-o.entry:o.entry-o.minPrice);o.mfeR=o.mfe/r;o.curR=(o.side==='LONG'?p-o.entry:o.entry-p)/r;renderJournal()}}}catch(_){}};w.onclose=()=>setTimeout(ws,2500)}renderJournal();scan();ws();setInterval(()=>document.visibilityState==='visible'&&scan(),60000);setInterval(()=>document.visibilityState==='visible'&&db.open&&evalOpen(),15000);
</script></body></html>
